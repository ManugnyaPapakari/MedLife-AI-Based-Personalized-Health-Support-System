<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>THERAPY AI - Virtual Nurse</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: url('vecteezy_green-and-blue-wave-background_.jpg') no-repeat center center/cover;
    }

    .chat-container {
      width: 400px;
      height: 150px;
      background: rgba(7, 75, 71, 0.6);
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(3, 125, 111, 0.7);
      backdrop-filter: blur(10px);
      overflow: hidden;
      transition: all 0.5s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .chat-container:hover {
      box-shadow: 0 6px 18px rgba(236, 240, 242, 0.9);
      transform: translate(-50%, -50%) scale(1.02);
    }

    .chat-container.expanded {
      width: 75%;
      height: 75%;
      cursor: default;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #242423, #000000);
      color: #ffffff;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .chat-header img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .chat-container.expanded .chat-messages {
      display: flex;
    }

    .message {
      padding: 10px;
      border-radius: 5px;
      max-width: 80%;
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .message img.avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
    }

    .bot {
      background: #101211;
      color: #e0e0e0;
      align-self: flex-start;
    }

    .user {
      background: #0764ce;
      color: #fff;
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .name {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .typing-avatar {
      width: 40px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    .chat-input {
      display: none;
      padding: 10px;
      background: #222;
      align-items: center;
      gap: 10px;
    }

    .chat-container.expanded .chat-input {
      display: flex;
    }

    .chat-input input[type="text"] {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      background: #333;
      color: #e0e0e0;
      border-radius: 5px;
    }

    .chat-input button {
      padding: 10px 15px;
      background: #fcfcfc;
      color: #121212;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    

   

    
    a {
      text-decoration: none;
      color: #00bfff;
    }
  </style>
</head>
<body>

  <div class="chat-container" id="chatContainer">
    <div class="chat-header" id="chatHeader">
      <img src="image-removebg-preview (7).png" alt="Logo" />
      THERAPY AI
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <img class="avatar" src="Kind (1).jpg" alt="Bot" />
        <div>
          <span class="name">Kind</span><br />
          👋 Hello! Tap here to start chatting.
        </div>
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your symptoms..." />
      <input type="file" id="imageInput" accept="image/*" hidden />
      <button id="sendButton">Send</button>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById("chatContainer");
    const chatMessages = document.getElementById("chatMessages");
    const userInput = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const chatHeader = document.getElementById("chatHeader");

    //const imageInput = document.getElementById("imageInput");
   // const fileNameSpan = document.getElementById("fileName");

   
    imageInput.addEventListener("change", () => {
      fileNameSpan.textContent = imageInput.files.length > 0
        ? imageInput.files[0].name
        : "No file chosen";
    });

    chatHeader.addEventListener("click", () => {
      chatContainer.classList.toggle("expanded");
    });

    function renderResponseWithMedia(content, imageUrl, videoUrl) {
      let result = content;

      if (imageUrl) {
        result += `<br><img src="${imageUrl}" alt="Related image" style="max-width: 200px; border-radius: 8px; margin-top: 10px;">`;
      }

      if (videoUrl) {
        result += `<br><a href="${videoUrl}" target="_blank">🎥 Watch Video</a>`;
      }

      return result;
    }

    async function sendMessage() {
      const userText = userInput.value.trim();
      const imageFile = imageInput.files[0];

      const formData = new FormData();
      formData.append("message", userText);
      if (imageFile) formData.append("image", imageFile);

      const userMessage = document.createElement("div");
      userMessage.classList.add("message", "user");
      userMessage.innerHTML = `
        <img class="avatar" src="cute-boy-helmet-with-headphones-3d-rendering-removebg-preview.png" alt="You">
        <div><span class="name">You</span><br>${userText}</div>`;
      chatMessages.appendChild(userMessage);
      userInput.value = "";
      imageInput.value = "";
      //fileNameSpan.textContent = "No file chosen";
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const typingMessage = document.createElement("div");
      typingMessage.classList.add("message", "bot", "typing");
      typingMessage.innerHTML = `
        <img class="avatar typing-avatar" src="image-removebg-preview (11).png" alt="Thinking...">
        <div><span class="name">Kind</span><br><em>Thinking...</em></div>`;
      chatMessages.appendChild(typingMessage);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const response = await fetch("http://127.0.0.1:5000/chat", {
          method: "POST",
          body: formData,
        });

        const data = await response.json();
        typingMessage.remove();

        const botMessage = document.createElement("div");
        botMessage.classList.add("message", "bot");
        botMessage.innerHTML = `
          <img class="avatar" src="Kind (1).jpg" alt="Bot">
          <div><span class="name">Kind</span><br>${renderResponseWithMedia(
            data.response,
            data.image_url,
            data.video_url
          )}</div>`;
        chatMessages.appendChild(botMessage);
        chatMessages.scrollTop = chatMessages.scrollHeight;

      } catch (error) {
        console.error("Error:", error);
      }
    }

    sendButton.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>

</body>
</html>
